# Reusable: keep one issue open while a scheduled or trunk run is red.
#
# A nightly that goes red and tells nobody is a nightly that stays red. Call this
# as the last job of the workflow you want watched:
#
#   alert:
#     needs: [test]
#     if: ${{ always() && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) }}
#     permissions: { issues: write }
#     uses: <owner>/Dale-OS/.github/workflows/ci-red-alert.yml@<sha>
#     with:
#       result: ${{ needs.test.result }}
#
# Red opens one issue per workflow and branch, or comments on it if it is
# already open. Green closes it. Cancelled and skipped runs change nothing, so a
# superseded run never closes a real alert.
name: ci-red-alert

on:
  workflow_call:
    inputs:
      result:
        description: The watched job's result (success, failure, cancelled, skipped)
        type: string
        required: true
      label:
        description: Label used to find the alert issue
        type: string
        default: ci-red

permissions:
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ inputs.result }}
          LABEL: ${{ inputs.label }}
        with:
          script: |
            const result = process.env.RESULT;
            const label = process.env.LABEL;
            if (!['success', 'failure'].includes(result)) {
              core.info(`result ${result}: no change to alerts`);
              return;
            }
            const { owner, repo } = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const title = `CI red: ${context.workflow} on ${branch}`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);

            if (result === 'success') {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `Green again at ${sha}: ${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number,
                  state: 'closed', state_reason: 'completed' });
                core.info(`closed #${existing.number}`);
              }
              return;
            }

            const body = `\`${context.workflow}\` failed on \`${branch}\` at ${sha} (${context.eventName}).\n\n${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Still red. ${body}` });
              core.info(`commented on #${existing.number}`);
              return;
            }
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205',
                description: 'A scheduled or trunk CI run is red' });
            } catch (e) {
              if (e.status !== 422) throw e; // 422: the label already exists
            }
            const created = await github.rest.issues.create({ owner, repo, title, labels: [label],
              body: `${body}\n\nThis issue closes itself when the workflow is green again.` });
            core.info(`opened #${created.data.number}`);
