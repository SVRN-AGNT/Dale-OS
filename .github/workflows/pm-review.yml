# Second-vendor PM on this repository's own PRs: every Claude `HANDOFF:` gets a
# ruling from Codex's own GitHub review (ChatGPT plan, no API key), with no
# person relaying it. The HANDOFF asks Codex (`@codex review`); the PM rules when
# Codex's summary comment says it finished that head. Uses the local copy of the
# shared workflow, so the ref is this commit. Other repositories pin a Dale-OS sha.
name: pm-review

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      comment_id:
        description: Id of an existing HANDOFF comment to review
        type: string
        required: true

permissions:
  contents: read

jobs:
  pm:
    # A dispatch on any other branch would run that branch's copy of the reviewer.
    # Codex's summary comment wakes the PM when a review finishes; GitHub alone can post as that app.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
      || (github.event.action == 'created' && startsWith(github.event.comment.body, 'HANDOFF:'))
      || (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' && contains(github.event.comment.body, '"status":"completed"'))
    # One run at a time per PR, so a HANDOFF and Codex finishing never post two rulings. Job-level, so the
    # PR's other comments (skipped by the `if`) never take the queue's one pending slot. Each run re-reads the PR.
    concurrency:
      group: pm-review-${{ github.event.issue.number || inputs.comment_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    uses: ./.github/workflows/ci-pm-review.yml
    with:
      ref: ${{ github.sha }}
      comment_id: ${{ github.event.comment.id || inputs.comment_id }}
      # CI and the PM's own caller are held: a PR that edits them gets the high bar.
      held_paths: '^(\.github/workflows/|ci/)'
      provider: chatgpt
      # AGENTS.md routes its reader to PRINCIPLES.md and the SKILL.md files, so Codex may read them as instructions.
      instruction_paths: '(^|/)(AGENTS(\.override)?|PRINCIPLES|SKILL)\.md$'
