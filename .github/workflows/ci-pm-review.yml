# Reusable: the second-vendor PM answers every Claude `HANDOFF:` with no person relaying it.
#
# A Claude session posts `HANDOFF:` (through the `claude` app, at byte zero,
# naming the PR's exact head) on a PR. This workflow reviews that head with
# OpenAI Codex, read-only, and posts a `PM REVIEW — CLEAR | CORRECT | HOLD |
# OWNER GATE` comment plus a `PM Review` check on the head (a push revokes it).
# Logic and rationale: ci/pm_review.py.
#
# Caller (one small file per repository; ci/README.md has the full block):
#
#   on:
#     issue_comment: { types: [created] }
#     workflow_dispatch: { inputs: { comment_id: { type: string, required: true } } }
#   permissions: { contents: read }
#   jobs:
#     pm:
#       # A dispatch must run from the default branch, or the branch picks its own reviewer.
#       if: (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) || startsWith(github.event.comment.body, 'HANDOFF:')
#       permissions: { contents: read, issues: write, pull-requests: write, checks: write, actions: read }
#       uses: <owner>/Dale-OS/.github/workflows/ci-pm-review.yml@<sha>
#       with:
#         ref: <sha>   # the same sha, so the script matches the workflow
#         comment_id: ${{ github.event.comment.id || inputs.comment_id }}
#       secrets:
#         openai_api_key: ${{ secrets.OPENAI_API_KEY }}
#
# provider: chatgpt (no API key) reads Codex's own GitHub review instead, on the
# owner's ChatGPT plan. The caller then also listens for Codex's summary comment,
# and each HANDOFF carries `@codex review` on a line of its own:
#
#   on:
#     issue_comment: { types: [created, edited] }
#   jobs:
#     pm:
#       if: ... || (github.event.action == 'created' && startsWith(github.event.comment.body, 'HANDOFF:'))
#             || (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' && contains(github.event.comment.body, 'codex-review-state:v1'))
#       concurrency: { group: 'pm-review-${{ github.event.issue.number || inputs.pr }}', cancel-in-progress: false }
#       with: { provider: chatgpt, expected_pr: '${{ inputs.pr }}', ... }   # and no secrets; dispatch takes comment_id and pr
#
# fallback: claude (with provider chatgpt) lets a fresh, read-only Claude rule
# when Codex answers the HANDOFF with its usage-limit refusal (5-hour or weekly)
# and has left nothing on the head. The caller passes the subscription token and
# also wakes on that refusal:
#
#   if: ... || (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' && contains(github.event.comment.body, 'reached your Codex usage limits'))
#   with: { provider: chatgpt, fallback: claude, ... }
#   secrets: { claude_code_oauth_token: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}' }
#
# The post job of a fallback run is named after its ruling ("PM fallback CLEAR
# #<pr> <head>"): the merge gate trusts a fallback ruling only through that
# name, which only this file's definition can give a job.
#
# It reviews; it never approves, merges, marks ready or deploys.
name: ci-pm-review

on:
  workflow_call:
    inputs:
      ref:
        description: Dale-OS ref to take the script from; pin it to the same sha as `uses:`
        type: string
        required: true
      comment_id:
        description: The HANDOFF comment to answer
        type: string
        required: true
      allowed_authors:
        description: Comma-separated GitHub logins whose HANDOFFs are reviewed
        type: string
        default: Tataku
      control_issue:
        description: Issue that may carry HANDOFF mirrors and whose body is the PM contract (0 for none)
        type: number
        default: 0
      contract_path:
        description: Optional file in the calling repository with the PM contract
        type: string
        default: ''
      held_paths:
        description: Optional regex of paths the repository holds for a person to merge
        type: string
        default: ''
      model:
        description: Codex model (empty = Codex default)
        type: string
        default: ''
      effort:
        description: Codex reasoning effort
        type: string
        default: high
      expected_pr:
        description: "Dispatch only: the PR the caller locked on; a comment on any other PR is refused"
        type: string
        default: ''
      instruction_paths:
        description: "chatgpt only: regex of paths Codex reads as review instructions (default: any AGENTS.md); a PR editing one gets HOLD"
        type: string
        default: ''
      ignore_checks:
        description: "One `workflow path#job name` per line: a failed run of that job, proven to come from the default branch's copy of that file, is not a failed check (owner ruling 2026-10-19: ACF's merge controller only; any other entry needs the owner's word)"
        type: string
        default: ''
      provider:
        description: "api: run Codex with an OpenAI API key. chatgpt: read Codex's own GitHub review (ChatGPT plan, no key)"
        type: string
        default: api
      fallback:
        description: "chatgpt only: 'claude' = when Codex refuses the HANDOFF at its usage limit, a fresh read-only Claude rules instead ('' = wait for Codex)"
        type: string
        default: ''
      fallback_model:
        description: Claude model for the fallback PM (the reasoning tier)
        type: string
        default: opus
      fallback_budget_usd:
        description: Cap on the plan usage one fallback review may take (notional dollars on the subscription)
        type: string
        default: '3'
    secrets:
      openai_api_key:
        required: false
      claude_code_oauth_token:
        required: false

permissions:
  contents: read

jobs:
  review:
    name: PM review
    # No runner input: this job's output becomes the ruling the merge gate reads, and with provider api it holds
    # openai_api_key, so it stays GitHub-hosted (Codex P1s on #42 and wallet-alpha-lab #168).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      # Run records prove which workflow a check came from (pm_review.py check_identity).
      actions: read
    outputs:
      review: ${{ steps.resolve.outputs.review }}
      notice: ${{ steps.resolve.outputs.notice }}
      pr: ${{ steps.resolve.outputs.pr }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      handoff_id: ${{ steps.resolve.outputs.handoff_id }}
      has_key: ${{ steps.cred.outputs.available }}
      final_message: ${{ steps.codex.outputs.final-message || steps.claude.outputs.final_message }}
      ruling: ${{ steps.resolve.outputs.ruling }}
      resolved_base_sha: ${{ steps.resolve.outputs.base_sha }}
      supersede: ${{ steps.resolve.outputs.supersede }}
    steps:
      - name: Checkout the caller's merged default branch (never the PR)
        if: inputs.provider == 'api'
        uses: actions/checkout@v4
        with:
          # Explicit: a hand-dispatched run on a PR branch must still see the merged
          # default branch, never the PR's tree (whose AGENTS.md Codex would load).
          ref: ${{ github.event.repository.default_branch }}
          path: caller
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the shared PM script
        uses: actions/checkout@v4
        with:
          repository: SVRN-AGNT/Dale-OS
          ref: ${{ inputs.ref }}
          path: shared
          # Full history: a PR that moves a caller's Dale-OS pin names a newer
          # commit, and the PM must be able to read that commit to rule on it.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the HANDOFF and its PR
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id }}
          ALLOWED_AUTHORS: ${{ inputs.allowed_authors }}
          CONTROL_ISSUE: ${{ inputs.control_issue }}
          HELD_PATHS: ${{ inputs.held_paths }}
          PROVIDER: ${{ inputs.provider }}
          CONTRACT_PATH: ${{ inputs.contract_path }}
          INSTRUCTION_PATHS: ${{ inputs.instruction_paths }}
          EXPECTED_PR: ${{ inputs.expected_pr }}
          IGNORE_CHECKS: ${{ inputs.ignore_checks }}
          FALLBACK: ${{ inputs.provider == 'chatgpt' && inputs.fallback || '' }}
        run: python3 shared/ci/pm_review.py resolve

      - name: Check provider credential
        id: cred
        if: (steps.resolve.outputs.review == 'true' && inputs.provider == 'api') || steps.resolve.outputs.review == 'claude'
        env:
          REVIEW: ${{ steps.resolve.outputs.review }}
          HAS_KEY: ${{ secrets.openai_api_key != '' }}
          HAS_CLAUDE: ${{ secrets.claude_code_oauth_token != '' }}
        run: |
          if [ "$REVIEW" = claude ]; then echo "available=${HAS_CLAUDE}"; else echo "available=${HAS_KEY}"; fi >> "$GITHUB_OUTPUT"

      - name: Checkout the caller's merged default branch for the Claude fallback (never the PR)
        if: steps.resolve.outputs.review == 'claude' && steps.cred.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: caller
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR as objects (no checkout)
        if: ((inputs.provider == 'api' && steps.resolve.outputs.review == 'true') || steps.resolve.outputs.review == 'claude') && steps.cred.outputs.available == 'true'
        working-directory: caller
        env:
          TOKEN: ${{ github.token }}
          PR: ${{ steps.resolve.outputs.pr }}
          HEAD: ${{ steps.resolve.outputs.head_sha }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags origin \
            "+refs/pull/${PR}/head:refs/remotes/pr/head" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse refs/remotes/pr/head)" = "$HEAD"

      - name: Write the PM's inputs
        id: prepare
        if: ((inputs.provider == 'api' && steps.resolve.outputs.review == 'true') || steps.resolve.outputs.review == 'claude') && steps.cred.outputs.available == 'true'
        env:
          REVIEWER: ${{ steps.resolve.outputs.review == 'claude' && 'claude' || 'codex' }}
          CALLER_DIR: caller
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          HELD: ${{ steps.resolve.outputs.held }}
          CONTRACT_PATH: ${{ inputs.contract_path }}
        run: python3 shared/ci/pm_review.py prepare

      - name: Install the fallback reviewer CLI
        if: steps.resolve.outputs.review == 'claude' && steps.cred.outputs.available == 'true'
        # Exact version, the one ci-agent-review.yml pins: this job holds the subscription token.
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.296

      # The last step that runs in a fallback job (the Codex step below is api-only): nothing may run after the
      # model in a job that holds a token. Read-only tools; the ruling is judged in the next job.
      - name: PM ruling (Claude fallback, read-only)
        id: claude
        if: steps.resolve.outputs.review == 'claude' && steps.cred.outputs.available == 'true'
        env:
          CALLER_DIR: caller
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_code_oauth_token }}
          MODEL: ${{ inputs.fallback_model }}
          BUDGET_USD: ${{ inputs.fallback_budget_usd }}
        run: python3 shared/ci/pm_review.py claude

      # LAST STEP OF THE JOB: drop-sudo is irreversible for the runner, and
      # nothing may run after the model in a job that holds a token.
      - name: PM ruling (OpenAI Codex, read-only)
        id: codex
        if: inputs.provider == 'api' && steps.resolve.outputs.review == 'true' && steps.cred.outputs.available == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.openai_api_key }}
          working-directory: ${{ github.workspace }}/caller
          prompt-file: ${{ github.workspace }}/caller/.pm-review/prompt.md
          output-schema-file: ${{ github.workspace }}/caller/.pm-review/schema.json
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}

  judge:
    name: Judge the Claude fallback ruling
    needs: review
    if: always() && needs.review.outputs.review == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ruling: ${{ steps.judge.outputs.ruling }}
      seal: ${{ steps.judge.outputs.seal }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SVRN-AGNT/Dale-OS
          ref: ${{ inputs.ref }}
          path: shared
          sparse-checkout: ci
          persist-credentials: false
      - name: Judge
        id: judge
        env:
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          PR_NUMBER: ${{ needs.review.outputs.pr }}
          FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
        run: python3 shared/ci/pm_review.py judge

  post:
    # A fallback ruling's job is named after it ("PM fallback CLEAR #<pr> <head>"). Job names come from this file
    # alone, so that name is the record the merge gate trusts (merge_gate.fallback_verdicts), not the comment.
    name: ${{ needs.judge.outputs.seal || 'Post the PM ruling' }}
    needs: [review, judge]
    if: always() && needs.review.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SVRN-AGNT/Dale-OS
          ref: ${{ inputs.ref }}
          path: shared
          sparse-checkout: ci
          persist-credentials: false
      - name: Post
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.review.outputs.pr }}
          REVIEW: ${{ needs.review.outputs.review }}
          NOTICE: ${{ needs.review.outputs.notice }}
          HAS_KEY: ${{ needs.review.outputs.has_key }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          BASE_SHA: ${{ needs.review.outputs.base_sha || needs.review.outputs.resolved_base_sha }}
          RULING: ${{ needs.review.outputs.ruling || needs.judge.outputs.ruling }}
          HANDOFF_ID: ${{ needs.review.outputs.handoff_id }}
          SUPERSEDE: ${{ needs.review.outputs.supersede }}
          FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: python3 shared/ci/pm_review.py post
